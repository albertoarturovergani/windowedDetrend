      new CustomEvent(&quot;openai:set_globals&quot;, {

    &quot;message&quot;,

        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||

        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

      }

    }

      element = event.target;

    }

  &lt;details&gt;&lt;summary&gt;Methods and differences from the original figure&lt;/summary&gt;
    &lt;p class=&quot;text-small&quot;&gt;Equations and initial guesses follow the original notebook. In B, the map uses four parameters with a free onset; the inset uses three parameters with a fixed onset, as in the notebook. D uses the original unconstrained solver. Estimated time constants may be nonphysical.&lt;/p&gt;
    &lt;p class=&quot;text-small&quot;&gt;Explicit corrections: E uses time and signal vectors of equal length for interpolation, fixing a notebook error. Insets use exactly τ rise = 3 ms and τ decay = 200 ms rather than the nearest grid point. D–F use the same methods for their insets and maps. F retains the sweep constraint at the peak estimated by the exponential rise fit.&lt;/p&gt;
    &lt;p class=&quot;text-small&quot;&gt;MSE computed at 0.1 ms resolution: B and D for t &amp;gt; 10 ms; E and F over the full epoch, following the sweep formulas. Curves displayed at 1 ms resolution, also retaining 14.9, 15 and 249.9 ms. Maps use no interpolation; tooltips show exact values. The square marks 3/200 ms, computed separately from the grid. Failed fits remain missing, without artificial MSE penalties.&lt;/p&gt;
