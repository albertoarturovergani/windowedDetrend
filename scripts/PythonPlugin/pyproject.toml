[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "windowed-detrend"
version = "0.1.0"
description = "Windowed detrending of epoched TMS-EEG and synthetic recovery benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "Alberto Arturo Vergani"}]
dependencies = ["numpy>=1.24"]
keywords = ["TMS", "EEG", "detrending", "capacitive-artifacts"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering"]

[project.optional-dependencies]
benchmark = ["scipy>=1.10", "matplotlib>=3.7"]
validation = ["scipy>=1.10", "pandas>=2.0"]
mne = ["mne>=1.6"]
dev = ["build>=1", "twine>=5"]

[project.urls]
Repository = "https://github.com/albertoarturovergani/windowedDetrend"
Paper = "https://doi.org/10.1088/1741-2552/ae668e"

[project.scripts]
windowed-detrend-benchmark = "windowed_detrend.benchmark:main"
windowed-detrend-artifact-sweep = "windowed_detrend.artifact_sweep:main"
windowed-detrend-scalp-benchmark = "windowed_detrend.scalp_benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
windowed_detrend = ["data/*.txt"]

